# Builds the site and deploys it to Cloudflare Pages on every push to main,
# and when the feed job (feed.yml) commits new items (a push by a workflow
# does not start other workflows, so feed.yml calls this one).
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   a token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
# Optional repository variables: PUBLIC_MAPILLARY_TOKEN, PUBLIC_STREET_LEVEL_PROVIDER, PUBLIC_GOOGLE_MAPS_KEY
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# One deploy at a time; a newer one replaces a queued one.
concurrency:
  group: deploy-pages
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A called run must build the feed commit, not the commit that started the schedule.
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
        env:
          PUBLIC_MAPILLARY_TOKEN: ${{ vars.PUBLIC_MAPILLARY_TOKEN }}
          PUBLIC_STREET_LEVEL_PROVIDER: ${{ vars.PUBLIC_STREET_LEVEL_PROVIDER }}
          PUBLIC_GOOGLE_MAPS_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=line12-tracker --branch=main
