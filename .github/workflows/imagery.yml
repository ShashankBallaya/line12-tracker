# Monthly: ask Esri World Imagery Wayback for newer satellite imagery of the before/after spots.
# scripts/build-wayback.mjs takes Esri's newest release and each spot's real capture date, and
# records the check date, so the site can say when it last looked. Commits and deploys each run.
name: Check satellite imagery

on:
  schedule:
    # 04:17 UTC on the 3rd of each month, clear of the feed job (minute 23 every 6 hours).
    - cron: '17 4 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: imagery
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The imagery script and the data check use Node's own modules only, so no npm install.
      - run: node scripts/build-wayback.mjs
      - run: node scripts/validate-data.mjs
      - id: commit
        run: |
          if git diff --quiet -- src/data/lines/line-12/beforeafter.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "line12-imagery[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/lines/line-12/beforeafter.json
          git commit -m "Imagery: monthly check of Esri Wayback"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
